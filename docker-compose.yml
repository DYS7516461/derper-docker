services:
  derper:
    image: ${DERPER_IMAGE}
    container_name: derper
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - -c=${DERP_CONFIG_FILE:-/var/lib/derper/certs/derper.key}
      - --hostname=${DERP_HOSTNAME}
      - --certmode=${DERP_CERT_MODE:-letsencrypt}
      - --certdir=${DERP_CERT_DIR:-/var/lib/derper/certs}
      - --a=:${DERP_HTTPS_PORT:-443}
      - --http-port=${DERP_HTTP_PORT:-80}
      - --stun-port=${DERP_STUN_PORT:-3478}
      - --verify-clients=${DERP_VERIFY_CLIENTS:-false}
    volumes:
      - derper-certs:${DERP_CERT_DIR:-/var/lib/derper/certs}

volumes:
  derper-certs:
