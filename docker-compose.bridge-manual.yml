# Bridge 网络 + 禁用 HTTP 端口（DERP_HTTP_PORT=-1，例如 manual 证书）时使用本文件。
# 与 docker-compose.bridge.yml 的区别：不发布 HTTP 宿主端口，避免 "-1:80/tcp" 非法映射。
services:
  derper:
    image: ${DERPER_IMAGE}
    container_name: derper
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${DERP_HTTPS_PORT:-4443}:443/tcp"
      - "${DERP_STUN_PORT:-3478}:3478/udp"
    command:
      - -c=${DERP_CONFIG_FILE:-/var/lib/derper/certs/derper.key}
      - --hostname=${DERP_HOSTNAME}
      - --certmode=${DERP_CERT_MODE:-letsencrypt}
      - --certdir=${DERP_CERT_DIR:-/var/lib/derper/certs}
      - --a=:443
      - --http-port=${DERP_HTTP_PORT:--1}
      - --stun-port=3478
      - --verify-clients=${DERP_VERIFY_CLIENTS:-false}
    volumes:
      - derper-certs:${DERP_CERT_DIR:-/var/lib/derper/certs}

volumes:
  derper-certs: