services:
  derper:
    image: ${DERPER_IMAGE}
    container_name: derper
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${DERP_HTTP_PORT:-80}:80/tcp"
      - "${DERP_HTTPS_PORT:-443}:443/tcp"
      - "${DERP_STUN_PORT:-3478}:3478/udp"
    command:
      - --hostname=${DERP_HOSTNAME}
      - --certmode=${DERP_CERT_MODE:-letsencrypt}
      - --certdir=${DERP_CERT_DIR:-/var/lib/derper/certs}
      - --a=:443
      - --http-port=80
      - --stun-port=3478
      - --verify-clients=${DERP_VERIFY_CLIENTS:-false}
    volumes:
      - derper-certs:${DERP_CERT_DIR:-/var/lib/derper/certs}

volumes:
  derper-certs:
