name: Build DERPer Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: "Tailscale version to build, for example v1.86.2"
        required: true
        default: "v1.86.2"
      push_latest:
        description: "Also push latest tag"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: derper
  PLATFORMS: linux/amd64,linux/arm64
  ACR_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
  ACR_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "push_latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${{ inputs.tailscale_version }}" >> "${GITHUB_OUTPUT}"
            echo "push_latest=${{ inputs.push_latest }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        if: env.ACR_REGISTRY != '' && env.ACR_USERNAME != '' && env.ACR_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Build image tags
        id: tags
        shell: bash
        run: |
          GHCR_REPOSITORY="${GITHUB_REPOSITORY,,}"
          GHCR_IMAGE="ghcr.io/${GHCR_REPOSITORY}"
          VERSION="${{ steps.version.outputs.value }}"

          {
            echo "value<<EOF"
            echo "${GHCR_IMAGE}:${VERSION}"

            if [[ -n "${ACR_REGISTRY}" && -n "${ACR_NAMESPACE}" ]]; then
              echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:${VERSION}"
            fi

            if [[ "${{ steps.version.outputs.push_latest }}" == "true" ]]; then
              echo "${GHCR_IMAGE}:latest"

              if [[ -n "${ACR_REGISTRY}" && -n "${ACR_NAMESPACE}" ]]; then
                echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:latest"
              fi
            fi

            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            TAILSCALE_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.tags.outputs.value }}
