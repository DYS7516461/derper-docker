name: Build DERPer Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: "Tailscale version to build, for example v1.86.2"
        required: true
        default: "v1.86.2"
      push_latest:
        description: "Also push latest tag"
        required: true
        default: false
        type: boolean
  schedule:
    # Check for new official Tailscale stable releases every 6 hours.
    # A build only runs when the version is not published in GHCR yet.
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: derper
  PLATFORMS: linux/amd64,linux/arm64
  ACR_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
  ACR_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  check-version:
    name: Check for new Tailscale version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Determine version to build
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) Tag push: build the pushed tag.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # 2) Manual dispatch: build the requested version.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tailscale_version }}"
            [[ "${VERSION}" == v* ]] || VERSION="v${VERSION}"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # 3) Scheduled run: build the latest official stable release if it
          #    has not been published to GHCR yet.
          LATEST="$(gh api repos/tailscale/tailscale/releases/latest --jq .tag_name)"
          echo "Latest official stable: ${LATEST}"
          TOKEN="$(curl -s "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY}:pull" | jq -r .token)"
          RESP="$(curl -s -H "Authorization: Bearer ${TOKEN}" "https://ghcr.io/v2/${GITHUB_REPOSITORY}/tags/list")"
          if echo "${RESP}" | jq -e --arg v "${LATEST}" '.tags | index($v)' >/dev/null 2>&1; then
            echo "Version ${LATEST} already published, skipping."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "version=${LATEST}" >> "${GITHUB_OUTPUT}"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build and push
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "push_latest=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "value=${{ needs.check-version.outputs.version }}" >> "${GITHUB_OUTPUT}"
            echo "push_latest=true" >> "${GITHUB_OUTPUT}"
          else
            VERSION="${{ inputs.tailscale_version }}"
            [[ "${VERSION}" == v* ]] || VERSION="v${VERSION}"
            echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "push_latest=${{ inputs.push_latest }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        if: env.ACR_REGISTRY != '' && env.ACR_NAMESPACE != '' && env.ACR_USERNAME != '' && env.ACR_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_NAMESPACE != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build image tags
        id: tags
        shell: bash
        run: |
          GHCR_REPOSITORY="${GITHUB_REPOSITORY,,}"
          GHCR_IMAGE="ghcr.io/${GHCR_REPOSITORY}"
          DOCKERHUB_REPOSITORY="${DOCKERHUB_NAMESPACE,,}/${DOCKERHUB_IMAGE:-derper}"
          DOCKERHUB_REPOSITORY="${DOCKERHUB_REPOSITORY,,}"
          VERSION="${{ steps.version.outputs.value }}"

          {
            echo "value<<EOF"
            echo "${GHCR_IMAGE}:${VERSION}"

            if [[ -n "${ACR_REGISTRY}" && -n "${ACR_NAMESPACE}" ]]; then
              echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:${VERSION}"
            fi

            if [[ -n "${DOCKERHUB_NAMESPACE}" && -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
              echo "docker.io/${DOCKERHUB_REPOSITORY}:${VERSION}"
            fi

            if [[ "${{ steps.version.outputs.push_latest }}" == "true" ]]; then
              echo "${GHCR_IMAGE}:latest"

              if [[ -n "${ACR_REGISTRY}" && -n "${ACR_NAMESPACE}" ]]; then
                echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:latest"
              fi

              if [[ -n "${DOCKERHUB_NAMESPACE}" && -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
                echo "docker.io/${DOCKERHUB_REPOSITORY}:latest"
              fi
            fi

            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            TAILSCALE_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
